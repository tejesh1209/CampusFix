services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusfix}
      POSTGRES_USER: ${POSTGRES_USER:-campusfix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusfix-local-password}
    volumes:
      - campusfix_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusfix} -d ${POSTGRES_DB:-campusfix}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-campusfix}:${POSTGRES_PASSWORD:-campusfix-local-password}@db:5432/${POSTGRES_DB:-campusfix}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-before-deploying}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-1440}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@campusfix.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  campusfix_data:
